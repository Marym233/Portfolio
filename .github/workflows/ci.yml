# Builds the site on every push and pull request, so a change that breaks the
# build is caught here rather than on the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      # Must stay >= 22.13: the pnpm version pinned in package.json needs it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI=true is set by Actions, so build.mjs turns its warnings (missing
      # image, placeholder email, unfilled slot) into a failure by itself.
      # Cloudflare sets CI=true too, so the deploy is gated by the same rule.
      - name: Build
        run: pnpm run build

      - name: Check the page rendered
        run: test -s dist/index.html || { echo "dist/index.html missing or empty"; exit 1; }
