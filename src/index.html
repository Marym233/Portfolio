<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{url}}/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="{{themeColor}}" />

  <!-- Link preview (WhatsApp, LinkedIn, Slack) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{siteName}}" />
  <meta property="og:title" content="{{pageTitle}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{url}}/" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{pageTitle}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{ogImage}}" />

  <!-- Icons -->
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/sections.css" />

  <script type="module" src="/js/main.js"></script>
</head>
<body>

{{header}}

<main id="top">
{{hero}}
{{about}}
{{experience}}
{{projects}}
{{skills}}
{{education}}
{{contact}}
</main>

{{footer}}

</body>
</html>
